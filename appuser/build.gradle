apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
  compileSdkVersion rootProject.ext.versions.compileSdkVersion

    defaultConfig {
    minSdkVersion 15
    targetSdkVersion rootProject.ext.versions.targetSdkVersion

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
    namespace 'com.mosl.mobile.user'
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  testImplementation deps.testing.junit

  implementation deps.kotlin

  implementation deps.rx.java
  implementation deps.rx.kotlin
  implementation deps.rx.preferences

  implementation deps.dagger.core
  kapt deps.dagger.compiler
  implementation deps.dagger.android
  kapt deps.dagger.androidCompiler

  implementation deps.kotlin
  implementation deps.retrofit.gson
  implementation deps.timber

  implementation project (':saathiapi')
  implementation project (':shared')
  api deps.mofslArtifacts.appcore
  implementation deps.mofslArtifacts.tokenmanager
  implementation deps.mofslArtifacts.moslcommons
  implementation deps.mofslArtifacts.appcore
  implementation(deps.androidx.security)
}
