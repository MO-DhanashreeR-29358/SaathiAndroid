apply plugin: 'com.android.library'
apply plugin: 'io.fabric'

android {
    compileSdkVersion rootProject.ext.versions.compileSdkVersion
    buildToolsVersion rootProject.ext.versions.buildToolsVersion

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion rootProject.ext.versions.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Enabling multidex support
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile files('libs/simple-xml-2.7.1.jar')
    compile files('libs/protobuf_2_4_1.jar')
    compile project(':TabLibrary')
    testCompile deps.testing.junit
    androidTestCompile(deps.testing.espresso.core)
    compile deps.sdpAndroid
    compile deps.support.design
    compile deps.support.customtabs
    compile deps.support.appcompat
    compile deps.slidinguppanel
    compile deps.okhttp
    compile deps.timber
    provided deps.javax
    compile deps.asyncHttp
    compile deps.imageLoader
    compile deps.multidex
    compile(deps.crashlytics) {
        transitive = true;
    }
    compile deps.constraintLayout
    compile deps.compressor
    compile project(':emendate')
    compile(name: 'nsdl-esign-2.1-v-1.1', ext: 'aar')
}
