apply plugin: 'com.android.library'
apply plugin: 'io.fabric'

buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }
}

repositories {
    maven { url 'https://maven.fabric.io/public' }
    google()
    flatDir {
        dirs '../eKYC/libs'

    }
}

android {
    compileSdkVersion 25
    buildToolsVersion '27.0.3'

    defaultConfig {

        minSdkVersion 15
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"

        // Enabling multidex support
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // compile fileTree(include: ['*.jar'], dir: 'libs')
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile files('libs/simple-xml-2.7.1.jar')
    compile files('libs/protobuf_2_4_1.jar')
//    compile files('libs/SamsungIndiaIdentity.jar')
    // compile files('libs/xom-1.2.10.jar')
    compile project(':TabLibrary')
    testCompile 'junit:junit:4.12'
    compile 'com.intuit.sdp:sdp-android:1.0.3'
    compile 'com.android.support:appcompat-v7:25.3.1'
    compile 'com.sothree.slidinguppanel:library:3.1.1'
    compile 'com.squareup.okhttp:okhttp:2.7.5'
    compile 'com.jakewharton.timber:timber:4.5.1'
    provided 'javax.annotation:jsr250-api:1.0'
    compile 'com.loopj.android:android-async-http:1.4.9'
    compile 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    compile 'com.android.support:multidex:1.0.1'
    compile('com.crashlytics.sdk.android:crashlytics:2.7.1@aar') {
        transitive = true;
    }
    compile 'com.android.support:customtabs:25.3.1'
    compile 'com.android.support:design:25.4.0'
    compile 'com.android.support.constraint:constraint-layout:1.0.2'
    compile 'id.zelory:compressor:2.1.0'
    compile project(':emendate')
    compile(name: 'nsdl-esign-2.1-v-1.1', ext: 'aar')
}
