apply plugin: 'com.android.library'
apply plugin: 'io.fabric'

android {
    compileSdkVersion rootProject.ext.versions.compileSdkVersion
    buildToolsVersion rootProject.ext.versions.buildToolsVersion

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion rootProject.ext.versions.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Enabling multidex support
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/simple-xml-2.7.1.jar')
    implementation files('libs/protobuf_2_4_1.jar')
    implementation project(':TabLibrary')
    testImplementation deps.testing.junit
    androidTestImplementation(deps.testing.espresso.core)
    implementation deps.sdpAndroid
    implementation deps.support.design
    implementation deps.support.customtabs
    implementation deps.support.appcompat
    implementation deps.slidinguppanel
    implementation deps.okHttp.core
    implementation deps.timber
    compileOnly deps.javax
    implementation deps.asyncHttp
    implementation deps.imageLoader
    implementation deps.multidex
    implementation(deps.crashlytics) {
        transitive = true;
    }
    implementation deps.constraintLayout
    implementation deps.compressor
    implementation project(':emendate')
    implementation(name: 'nsdl-esign-2.1-v-1.1', ext: 'aar')
}
