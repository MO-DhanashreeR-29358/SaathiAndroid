def gitSha() {
    def p = 'git rev-parse --short HEAD'.execute([], project.rootDir)
    p.waitFor()
    if (p.exitValue() != 0) {
        throw new RuntimeException(p.errorStream.text)
    }

    return p.text.trim()
}

def gitTimestamp() {
    def p = 'git log -n 1 --format=%at'.execute([], rootDir)
    p.waitFor()
    if (p.exitValue() != 0) {
        throw new RuntimeException(p.errorStream.text)
    }

    return p.text.trim()
}

android {
    packagingOptions {
        resources {
            excludes += ['META-INF/domain.kotlin_module', 'META-INF/rxkotlin.kotlin_module', 'META-INF/coreui_release.kotlin_module', 'META-INF/core_release.kotlin_module', 'META-INF/appuser_release.kotlin_module','META-INF/appuserMyzone_release.kotlin_module', 'META-INF/loginui_release.kotlin_module', 'META-INF/data_release.kotlin_module', 'META-INF/rxbinding_release.kotlin_module']
        }
    }
    compileSdkVersion rootProject.ext.versions.compileSdkVersion

    Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(file('../version.properties')))

    buildFeatures {
             viewBinding true
    }

    buildFeatures {
        dataBinding true
    }
    defaultConfig {
        applicationId 'com.mosl.tabapp'
        minSdkVersion 26
        targetSdkVersion rootProject.ext.versions.targetSdkVersion
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha()}\""
        buildConfigField 'long', 'GIT_TIMESTAMP', "${gitTimestamp()}L"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        internal {
            try {
                storeFile file('../saleskey.jks')
                storePassword KEYSTORE_PASSWORD
                keyAlias 'sales tab'
                keyPassword PROD_ALIAS_PASSWORD
            } catch (ex) {
                throw new InvalidUserDataException(
                        "You should define KEYSTORE_PASSWORD & UAT_ALIAS_PASSWORD in gradle.properties")
            }
        }
        prod {
            try {
                storeFile file('../saleskey.jks')
                storePassword KEYSTORE_PASSWORD
                keyAlias 'sales tab'
                keyPassword PROD_ALIAS_PASSWORD
            } catch (ex) {
                throw new InvalidUserDataException(
                        "You should define KEYSTORE_PASSWORD & PROD_ALIAS_PASSWORD in gradle.properties")
            }
        }
    }

    flavorDimensions 'releaseType'
    productFlavors {
        uat {
            versionCode versionProps['uatCode'].toInteger()
            versionName versionProps['uatName']
            applicationIdSuffix '.uat'
            signingConfig signingConfigs.internal
            buildConfigField 'boolean', 'LOGOUT_ON_UPDATE', "${versionProps['clearUserLogin']}"
            dimension 'releaseType'
        }
        prod {
            versionCode versionProps['prodCode'].toInteger()
            versionName versionProps['prodName']
            signingConfig signingConfigs.prod
            buildConfigField 'boolean', 'LOGOUT_ON_UPDATE', "${versionProps['prodClearUserLogin']}"
            dimension 'releaseType'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFile 'proguard-conceal.pro'
            proguardFile 'proguard-crashlytics.pro'
            proguardFile 'proguard-gson.pro'
            proguardFile 'proguard-slidingpanel.pro'
            proguardFile 'proguard-dagger.pro'
            proguardFile 'proguard-retrofit.pro'
            proguardFile 'proguard-okhttp.pro'
            proguardFile 'proguard-simple-xml.pro'
            proguardFile 'proguard-dista.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            //applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            ext.enableCrashlytics = false
            ext.alwaysUpdateBuildId = false
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${project.name}-${variant.name}-${variant.versionName}.apk"
        }
    }

    lint {
        checkReleaseBuilds false
    }
    namespace 'com.mosl.tabapp'
    configurations {
        implementation.exclude module:'protobuf-lite'
    }

        compileOptions {
            coreLibraryDesugaringEnabled false
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }



}


