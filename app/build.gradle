buildscript {
    repositories {
        mavenLocal()
        jcenter()
        maven { url 'https://maven.fabric.io/public' }

    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.23.0'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

android {
    compileSdkVersion 25
    buildToolsVersion '27.0.3'
    def Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(file('../version.properties')))
    defaultConfig {
        applicationId 'com.mosl.tabapp'
        minSdkVersion 15
        targetSdkVersion 25
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    flavorDimensions 'releaseType'
    productFlavors {
        uat {
            versionCode versionProps['uatCode'].toInteger()
            versionName versionProps['uatName']
            buildConfigField 'String', 'CRM_BASE_URL', '"http://122.184.137.226:83/api/"'
            buildConfigField 'String', 'UPPERMOST_URL', '"http://122.184.137.89/Partner/PartnerMobileWebServices.asmx/"'
            buildConfigField 'String', 'CRM_COLLATERAL_URL', '"http://web20.motilaloswal.com:8000/Brochure/index.html"'
            dimension 'releaseType'

        }
        prod {
            versionCode versionProps['prodCode'].toInteger()
            versionName versionProps['prodName']
            buildConfigField 'String', 'CRM_BASE_URL', '"http://saathi.motilaloswal.com:81/api/"'
            buildConfigField 'String', 'UPPERMOST_URL', '"https://login.motilaloswal.com/Partner/PartnerMobileWebServices.asmx/"'
            buildConfigField 'String', 'CRM_COLLATERAL_URL', '"https://www.motilaloswal.com/EKYCCONTROLLER/Brochure/index.html"'
            dimension 'releaseType'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            multiDexKeepFile file('multidex-config.txt')
            proguardFile 'proguard-library.pro'
            proguardFile 'proguard-crashlytics.pro'
            proguardFile 'proguard-gson.pro'
            proguardFile 'proguard-saxparser.pro'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            multiDexEnabled true
            multiDexKeepFile file('multidex-config.txt')
            debuggable true
        }
    }


    packagingOptions {
        exclude 'META-INF/rxjava.properties'
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }

}
repositories {
    mavenLocal()
    jcenter()
    maven { url "https://jitpack.io" }
    maven { url 'https://maven.fabric.io/public' }
    google()
    flatDir {
        dirs '../eKYC/libs'
    }
}

dependencies {
    compile project(':TabLibrary')
    compile project(':eKYC')
    compile('com.crashlytics.sdk.android:crashlytics:2.7.1@aar') {
        transitive = true;
    }
    compile 'com.android.support:appcompat-v7:25.3.1'
    compile 'com.android.support:design:25.4.0'
    compile 'com.astuetz:pagerslidingtabstrip:1.0.1'
    compile 'com.intuit.sdp:sdp-android:1.0.2'
    compile 'de.hdodenhof:circleimageview:1.2.1'
    compile 'com.android.support:multidex:1.0.1'
    compile 'com.android.support:customtabs:25.1.0'
    compile 'com.github.PhilJay:MPAndroidChart:v3.0.1'
    compile 'com.github.bumptech.glide:glide:3.7.0'
    compile 'com.android.support:support-v4:25.1.0'
    compile 'com.android.support:recyclerview-v7:25.1.0'
    compile 'com.prolificinteractive:material-calendarview:1.4.3'
    compile 'com.android.support:cardview-v7:25.3.1'
    compile 'com.loopj.android:android-async-http:1.4.9'
    compile 'com.hannesdorfmann.smoothprogressbar:library:1.0.0'
    compile 'com.orhanobut:dialogplus:1.11@aar'
    compile 'com.getbase:floatingactionbutton:1.10.1'
    compile 'com.android.support:support-vector-drawable:25.0.0'
    compile 'com.google.firebase:firebase-messaging:10.0.1'
    testCompile 'junit:junit:4.12'
    androidTestCompile 'com.android.support.test.espresso:espresso-core:2.0'
    compile 'com.jakewharton.timber:timber:4.5.1'
    compile 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    compile 'org.apache.commons:commons-lang3:3.4'
    compile 'info.hoang8f:android-segmented:1.0.6'
    compile('com.crashlytics.sdk.android:answers:1.3.13@aar') {
        transitive = true;
    }
    compile 'me.relex:circleindicator:1.2.2'
    compile 'org.sufficientlysecure:html-textview:3.4'
    compile(name: 'nsdl-esign-2.1-v-1.1', ext: 'aar')
}

apply plugin: 'com.google.gms.google-services'