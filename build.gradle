buildscript {
  ext.google_services_version = '4.2.0'
  ext.android_plugin_version = '3.4.1'
  ext.kotlin_version = '1.3.31'
  repositories {
    google()
    jcenter()
    maven { url 'https://maven.fabric.io/public' }
    maven {
      url 'http://192.168.103.116:9090/artifactory/libs-release-local'
    }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:${android_plugin_version}"
    classpath "com.google.gms:google-services:$google_services_version"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath 'io.fabric.tools:gradle:1.29.0'
  }
}

ext.versions = ["compileSdkVersion"   : 28,
                "targetSdkVersion"    : 28,
                "buildToolsVersion"   : "28.0.3",
                'supportLibrary'      : '28.0.0',
                'multidex'            : '1.0.3',
                'pagerslidingtabstrip': '1.0.1',
                'sdp'                 : '1.0.3',
                'circleimageview'     : '2.2.0',
                'glide'               : '3.7.0',
                'calendarview'        : '1.4.3',
                'asyncHttp'           : '1.4.9',
                'smoothprogressbar'   : '1.1.0',
                'floatingbutton'      : '1.10.1',
                'firebase'            : '17.3.4',
                'espresso'            : '3.0.2',
                'timber'              : '4.7.1',
                'imageLoader'         : '1.9.5',
                'circleIndicator'     : '1.2.2',
                'okhttp'              : '3.12.3',
                'stetho'              : '1.5.0',
                'gson'                : '2.8.5',
                'retrofit'            : '2.5.0',
                'rxJava'              : '2.2.8',
                'rxBinding'           : '2.1.1',
                'groupie'             : '2.3.0',
                'room'                : '1.1.1',
                'dagger'              : '2.22.1',
                'leakCanary'          : '1.6.3',
                'okHttp'              : '3.12.3'
                ]

ext.deps = ['support'             : ['design'      : "com.android.support:design:${versions.supportLibrary}",
                                     'cardview'    : "com.android.support:cardview-v7:${versions.supportLibrary}",
                                     'customtabs'  : "com.android.support:customtabs:${versions.supportLibrary}",
                                     'appcompat'   : "com.android.support:appcompat-v7:${versions.supportLibrary}",
                                     'drawable'    : "com.android.support:support-vector-drawable:${versions.supportLibrary}",
                                     'recyclerview': "com.android.support:recyclerview-v7:${versions.supportLibrary}",
                                      'annotation' : "com.android.support:support-annotations:${versions.supportLibrary}",
                                     'support'     : "com.android.support:support-v4:${versions.supportLibrary}"],
            'constraintLayout'    : "com.android.support.constraint:constraint-layout:1.1.3",

            'testing'             : ['espresso': ['core': "com.android.support.test.espresso:espresso-core:${versions.espresso}"],
                                     'junit'   : 'junit:junit:4.12',
                                     'runner'  : 'com.android.support.test:runner:1.0.2'],
            'stetho'              : ['stetho': "com.facebook.stetho:stetho:${versions.stetho}",
                                     'okhttp': "com.facebook.stetho:stetho-okhttp3:${versions.stetho}"],
            'room'                : ['roomRuntime' : "android.arch.persistence.room:runtime:${versions.room}",
                                     'roomCompiler': "android.arch.persistence.room:compiler:${versions.room}"],
            'crashlytics'         : 'com.crashlytics.sdk.android:crashlytics:2.9.4@aar',
            'multidex'            : "com.android.support:multidex:${versions.multidex}",
            'pagerslidingtabstrip': "com.astuetz:pagerslidingtabstrip:${versions.pagerslidingtabstrip}",
            'sdpAndroid'          : "com.intuit.sdp:sdp-android:${versions.sdp}",
            'circleImageView'     : "de.hdodenhof:circleimageview:${versions.circleimageview}",
            'mpChart'             : 'com.github.PhilJay:MPAndroidChart:v3.0.3',
            'glide'               : "com.github.bumptech.glide:glide:${versions.glide}",
            'calendarView'        : "com.prolificinteractive:material-calendarview:${versions.calendarview}",
            'asyncHttp'           : "com.loopj.android:android-async-http:${versions.asyncHttp}",
            'dialogPlus'          : "com.orhanobut:dialogplus:1.11@aar",
            'smoothProgressbar'   : "com.github.castorflex.smoothprogressbar:library:${versions.smoothprogressbar}",
            'floatingButton'      : "com.getbase:floatingactionbutton:${versions.floatingbutton}",
            'firebase'            : "com.google.firebase:firebase-messaging:${versions.firebase}",
            'timber'              : "com.jakewharton.timber:timber:${versions.timber}",
            'imageLoader'         : "com.nostra13.universalimageloader:universal-image-loader:${versions.imageLoader}",
            'retrofit'            : ['core'  : "com.squareup.retrofit2:retrofit:${versions.retrofit}",
                                     'mock'  : "com.squareup.retrofit2:retrofit-mock:${versions.retrofit}",
                                     'gson'  : "com.squareup.retrofit2:converter-gson:${versions.retrofit}",
                                      'scalar': "com.squareup.retrofit2:converter-scalars:${versions.retrofit}",
                                     'rxJava': "com.squareup.retrofit2:adapter-rxjava2:${versions.retrofit}"],
            'rx'                  : ['java'       : "io.reactivex.rxjava2:rxjava:${versions.rxJava}",
                                     'android'    : "io.reactivex.rxjava2:rxandroid:2.0.2",
                                    'kotlin': "io.reactivex.rxjava2:rxkotlin:2.3.0",
                                     'preferences': "com.f2prateek.rx.preferences2:rx-preferences:2.0.0"],
            'rxBinding'           : ['core': "com.jakewharton.rxbinding2:rxbinding:${versions.rxBinding}",
                                     'V4'  : "com.jakewharton.rxbinding2:rxbinding-support-v4:${versions.rxBinding}",
                                     'platform': "com.jakewharton.rxbinding3:rxbinding:3.0.0-alpha2",],
            'leakCanary'          : ["debug"  : "com.squareup.leakcanary:leakcanary-android:${versions.leakCanary}",
                                     "release": "com.squareup.leakcanary:leakcanary-android-no-op:${versions.leakCanary}"],
            'kotlin'              : "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlin_version}",
            'gson'                : "com.google.code.gson:gson:${versions.gson}",
            'commonsLang'         : "org.apache.commons:commons-lang3:3.4",
            'segmented'           : "info.hoang8f:android-segmented:1.0.6",
            'circleIndicator'     : "me.relex:circleindicator:${versions.circleIndicator}",
            'htmlTextview'        : "org.sufficientlysecure:html-textview:3.4",
            'slidinguppanel'      : "com.sothree.slidinguppanel:library:3.1.1",
            'okHttp'              : ['core'  : "com.squareup.okhttp3:okhttp:${versions.okhttp}",
                                     'logger': "com.squareup.okhttp3:logging-interceptor:${versions.okhttp}"],
            'playService'         : "com.google.android.gms:play-services-base:16.1.0",
            'compressor'          : "id.zelory:compressor:2.1.0",
            'location'            : "com.google.android.gms:play-services-location:16.0.0",
            'work'                : "android.arch.work:work-runtime:1.0.1",
            'mofslArtifacts'      : ['validator'    : "MofslArtifacts:validator:1.0.6",
                                    'annotation'   : "MofslArtifacts:annotations:1.0.1",
                                    'appcore': "MofslArtifacts:appcore:1.0.62-alpha13",
                                    'appcoreui': "MofslArtifacts:appcoreui:1.0.34",
                                    'navigator': "MofslArtifacts:navigator:1.0.6",
                                    'groupie': "MofslArtifacts:groupie_extensions:1.0.7",
                                    'tableview': "MofslArtifacts:tableview:1.0.35",
                                    'tableviewx': "MofslArtifacts:tableview_extensions:1.0.18"],
            'dataBindCompiler'       : "androidx.databinding:databinding-compiler:${android_plugin_version}",
            'dagger'              : ['core': "com.google.dagger:dagger:${versions.dagger}",
                                    'compiler': "com.google.dagger:dagger-compiler:${versions.dagger}",
                                    'android': "com.google.dagger:dagger-android-support:${versions.dagger}",
                                    'androidCompiler': "com.google.dagger:dagger-android-processor:${versions.dagger}"],
            'okhttp'              : ['okio': "com.squareup.okio:okio:${versions.okIo}",
                                  'core': "com.squareup.okhttp3:okhttp:${versions.okHttp}",
                                  'logger': "com.squareup.okhttp3:logging-interceptor:${versions.okHttp}"],
            'javax'               : "javax.annotation:jsr250-api:1.0",

]

allprojects {
  repositories {
    google()
    jcenter()
    mavenLocal()
    maven {
      url 'https://maven.google.com/'
      name 'Google'
    }
    maven {
      url 'http://192.168.103.116:9090/artifactory/libs-release-local'
    }
    maven { url "https://jitpack.io" }
    maven { url 'https://maven.fabric.io/public' }
    flatDir {
      dirs '../eKYC/libs'
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
