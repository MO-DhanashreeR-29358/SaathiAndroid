buildscript {
    ext.google_services_version = '4.3.10'
    ext.android_plugin_version = '7.3.0'
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven {
            url 'http://192.168.101.169:9090/artifactory/libs-release-local'
            allowInsecureProtocol  = true
        }
        maven { url = uri("https://artifacts.netcore.co.in/artifactory/android") }
    }
    dependencies {
        classpath 'com.google.firebase:perf-plugin:1.4.1' //Firebase Performance
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
        //Add the Crashlytics Gradle plugin
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.6'
    }
}

